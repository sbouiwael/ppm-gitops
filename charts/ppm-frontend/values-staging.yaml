# ── Staging environment overrides ─────────────────────────────────────────────
image:
  repository: ghcr.io/sbouiwael/ppm-frontend
  tag: latest

replicaCount: 1

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: ppm-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ppm-frontend-staging-tls
      hosts:
        - ppm-staging.example.com

env:
  BACKEND_URL: "http://ppm-backend.ppm-staging.svc.cluster.local:8082"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70