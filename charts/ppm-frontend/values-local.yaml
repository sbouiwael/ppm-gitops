# ==============================================================
# ppm-frontend - LOCAL environment overrides (Minikube / kind / k3d)
# ==============================================================

image:
  repository: ghcr.io/sbouiwael/ppm-frontend
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

# Backend service uses port 8082 (Spring Boot SERVER_PORT and Service.port).
# This local file fixes the port; test/staging/prod values are kept untouched
# for promote-test contract — see open questions in ppm-infra/README.md.
env:
  # Service name is the Argo CD release name (ppm-backend-local), not "ppm-backend".
  # nginx resolves this upstream at startup, so it must match the real Service DNS.
  BACKEND_URL: "http://ppm-backend-local.ppm-local.svc.cluster.local:8082"

# ── Security context override (LOCAL only) ──────────────────────────────────
# The published image is a stock `nginx:alpine` (runs as root): its entrypoint
# writes the rendered config to /etc/nginx/conf.d/default.conf, nginx writes its
# pid to /run/nginx.pid, and it listens on :80 — none of which work under the
# chart default (runAsUser 101 + capabilities.drop[ALL]). Run as root here so the
# stock image works on Minikube. test/staging/prod keep the non-root default.
# Proper cloud fix = rebuild the frontend on `nginxinc/nginx-unprivileged`
# (uid 101, writable dirs, listen 8080) — tracked as a follow-up.
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  fsGroup: 0
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: []

ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: "ppm.local"
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
