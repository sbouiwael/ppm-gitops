# ── Production environment overrides ──────────────────────────────────────────
image:
  repository: ghcr.io/sbouiwael/ppm-frontend
  tag: latest   # pinned by the promote-prod CI job

replicaCount: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: ppm.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ppm-frontend-prod-tls
      hosts:
        - ppm.example.com

env:
  BACKEND_URL: "http://ppm-backend.ppm-prod.svc.cluster.local:8082"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70