# ==============================================================
# ppm-backend - LOCAL environment overrides (Minikube / kind / k3d)
# Provider-agnostic: works on any kubeconfig context.
# Bootstrapped by ppm-infra (Terraform) which creates:
#   - Namespace ppm-local
#   - Secret ppm-backend-secrets-local (DB_PASSWORD, JWT_SECRET)
#   - MySQL release at ppm-mysql.ppm-local.svc.cluster.local:3306
# ==============================================================

image:
  repository: ghcr.io/sbouiwael/ppm-backend
  # Immutable registry tag pulled from GHCR (public package). This image already
  # contains the SecurityConfig change that permits /actuator/prometheus (built and
  # signed by the backend CI). Replaces the earlier node-local `actuator-fix` hack:
  # the cluster now pulls a real, immutable image like any other environment. Bump
  # this to a newer sha-xxxxxxx to roll forward via GitOps (Argo CD picks it up).
  tag: "sha-c5c8868"
  pullPolicy: IfNotPresent

replicaCount: 1

env:
  DB_HOST: "ppm-mysql.ppm-local.svc.cluster.local"
  DB_PORT: "3306"
  DB_NAME: "PPM"
  DB_USER: "ppm_user"
  DDL_AUTO: "validate"
  SPRING_PROFILES_ACTIVE: "staging"
  JWT_EXPIRATION_MS: "86400000"
  CORS_ALLOWED_ORIGINS: "http://localhost,http://ppm.local"
  FILE_UPLOAD_DIR: "/app/projects"

# Secret created by ppm-infra/terraform/modules/ppm-secrets
secretName: "ppm-backend-secrets-local"

# Ingress OFF for local-by-default: use `kubectl port-forward` or `minikube tunnel`.
# Flip to true if you have an ingress controller and want host-based access.
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: "api.ppm.local"
      paths:
        - path: /api
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClass: ""   # cluster default (Minikube: standard / k3d: local-path)
  size: "1Gi"
  accessMode: ReadWriteOnce
  mountPath: /app/projects

autoscaling:
  enabled: false

# Expose the backend to Prometheus (kube-prometheus-stack is installed locally).
serviceMonitor:
  enabled: true

# ── Cold-start (Minikube contraint) ──────────────────────────────────────────
# Le demarrage a froid du backend (JVM + Spring + Flyway + JPA) peut depasser la
# fenetre de la livenessProbe (~105 s) sur un noeud lent, ce qui tuait le pod et
# provoquait un CrashLoopBackOff. Le startupProbe laisse jusqu'a ~7 min pour
# demarrer ; une fois reussi, liveness et readiness prennent le relais normalement.
# (Complete l'initContainer wait-for-db, qui gere l'ordre de disponibilite MySQL.)
startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8082
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 40
  timeoutSeconds: 5

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
