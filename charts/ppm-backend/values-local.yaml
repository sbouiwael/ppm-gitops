# ==============================================================
# ppm-backend - LOCAL environment overrides (Minikube / kind / k3d)
# Provider-agnostic: works on any kubeconfig context.
# Bootstrapped by ppm-infra (Terraform) which creates:
#   - Namespace ppm-local
#   - Secret ppm-backend-secrets-local (DB_PASSWORD, JWT_SECRET)
#   - MySQL release at ppm-mysql.ppm-local.svc.cluster.local:3306
# ==============================================================

image:
  repository: ghcr.io/sbouiwael/ppm-backend
  # Locally-built image (SecurityConfig permits /actuator/prometheus) loaded into
  # Minikube via `minikube image load ...:actuator-fix`. This tag exists ONLY on
  # the local node, so pullPolicy MUST stay IfNotPresent (it is not on GHCR).
  # Once the same change is pushed to ppm-backend and CI rebuilds, switch back to
  # a registry tag (e.g. latest or the promoted sha-xxxx).
  tag: "actuator-fix"
  pullPolicy: IfNotPresent

replicaCount: 1

env:
  DB_HOST: "ppm-mysql.ppm-local.svc.cluster.local"
  DB_PORT: "3306"
  DB_NAME: "PPM"
  DB_USER: "ppm_user"
  DDL_AUTO: "validate"
  SPRING_PROFILES_ACTIVE: "staging"
  JWT_EXPIRATION_MS: "86400000"
  CORS_ALLOWED_ORIGINS: "http://localhost,http://ppm.local"
  FILE_UPLOAD_DIR: "/app/projects"

# Secret created by ppm-infra/terraform/modules/ppm-secrets
secretName: "ppm-backend-secrets-local"

# Ingress OFF for local-by-default: use `kubectl port-forward` or `minikube tunnel`.
# Flip to true if you have an ingress controller and want host-based access.
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: "api.ppm.local"
      paths:
        - path: /api
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClass: ""   # cluster default (Minikube: standard / k3d: local-path)
  size: "1Gi"
  accessMode: ReadWriteOnce
  mountPath: /app/projects

autoscaling:
  enabled: false

# Expose the backend to Prometheus (kube-prometheus-stack is installed locally).
serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
