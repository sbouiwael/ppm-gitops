{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ppm-backend.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ppm-backend.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # ── Cloud IAM integration (add annotation after provider choice) ──────────
  # AWS IRSA (S3 + Secrets Manager):
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ppm-backend-role
  # Azure Workload Identity (Blob + Key Vault):
  #   azure.workload.identity/client-id: "CLIENT_ID"
  # GCP Workload Identity (GCS + Secret Manager):
  #   iam.gke.io/gcp-service-account: ppm-backend@PROJECT.iam.gserviceaccount.com
{{- end }}