apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ppm-backend-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sbouiwael/ppm-gitops.git
    targetRevision: main
    path: charts/ppm-backend
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ppm-prod
  # Production: manual sync only — no automated prune/selfHeal.
  # A human must approve each sync in the Argo CD UI or via CLI.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true